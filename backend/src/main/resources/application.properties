spring.application.name=astro-leadflow

spring.datasource.url=${DB_URL:jdbc:h2:mem:leadflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASS:}

jwt.secret=${JWT_SECRET:change-this-dev-jwt-secret-with-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

aws.region=${AWS_REGION:us-east-1}
aws.sqs.new-leads-queue-url=${SQS_NEW_LEADS_URL:}
aws.sns.enabled=${SNS_ENABLED:false}
app.aws.enabled=${APP_AWS_ENABLED:false}
spring.cloud.aws.sqs.enabled=${AWS_SQS_ENABLED:false}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration}

meta.webhook-verify-token=${META_VERIFY_TOKEN:dev-verify-token}
meta.api-url=${META_API_URL:https://graph.facebook.com/v19.0}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.astro.leadflow=INFO
logging.level.org.hibernate.SQL=WARN


# ── Integração Webmotors ─────────────────────────────────────────
# Defaults apontam para HOMOLOGAÇÃO. Em produção, sobrescrever auth-url e api-base-url.
integrations.webmotors.enabled=${WEBMOTORS_ENABLED:false}
integrations.webmotors.auth-url=${WEBMOTORS_AUTH_URL:https://hlg-webmotors.sensedia.com/oauth/v1/access-token}
integrations.webmotors.api-base-url=${WEBMOTORS_API_URL:https://hlg-webmotors.sensedia.com}
integrations.webmotors.poll-interval-ms=${WEBMOTORS_POLL_INTERVAL_MS:300000}
integrations.webmotors.page-param=${WEBMOTORS_PAGE_PARAM:pagina}
# AES-256 em Base64 (32 bytes). Gerar com: openssl rand -base64 32
integrations.webmotors.secrets-key=${WEBMOTORS_SECRETS_KEY:}
