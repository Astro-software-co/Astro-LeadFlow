spring:
  application:
    name: astro-leadflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leadflow}
    username: ${DB_USER:leadflow}
    password: ${DB_PASS:leadflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    new-leads-queue-url: ${SQS_NEW_LEADS_URL}
  sns:
    enabled: ${SNS_ENABLED:false}

meta:
  webhook-verify-token: ${META_VERIFY_TOKEN}
  api-url: https://graph.facebook.com/v19.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.astro.leadflow: INFO
    org.hibernate.SQL: WARN