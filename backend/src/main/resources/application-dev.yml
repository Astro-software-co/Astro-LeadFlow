spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/leadflow
    username: leadflow
    password: leadflow123
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 2000ms

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566
      s3:
        endpoint: http://localhost:4566
      autoconfigure:
        exclude: io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration

marketplace:
  reconciliation:
    enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:3001}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  auth:
    refresh-cookie:
      secure: false
    session:
      idle-timeout-ms: 900000
  dev:
    bootstrap-admin:
      enabled: true
      organization-name: Astro Demo
      organization-slug: astro-demo
      admin-name: Manager Demo
      email: manager@astro.dev
      password: senha123
  jwt:
    secret: local_dev_secret_key_must_be_at_least_32_chars_long
    expiration-ms: 300000
    refresh-expiration-ms: 900000
  rate-limit:
    auth-per-minute: 200
  meta:
    api-url: https://graph.facebook.com/v19.0
    webhook-verify-token: local_dev_token
  abacatepay:
    api-url: https://api.abacatepay.com/v2
    api-key: ${ABACATEPAY_API_KEY:}
    webhook-secret: ${ABACATEPAY_WEBHOOK_SECRET:}
  aws:
    enabled: false
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*

logging:
  level:
    com.astro.leadflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
