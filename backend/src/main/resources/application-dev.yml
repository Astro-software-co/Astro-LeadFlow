spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/leadflow
    username: leadflow
    password: leadflow123
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 2000ms

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566
      s3:
        endpoint: http://localhost:4566
      autoconfigure:
        exclude: io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration

marketplace:
  reconciliation:
    enabled: true

app:
  base-url: http://localhost:8080
  auth:
    refresh-cookie:
      secure: false
  jwt:
    secret: local_dev_secret_key_must_be_at_least_32_chars_long
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  rate-limit:
    auth-per-minute: 200
  meta:
    api-url: https://graph.facebook.com/v19.0
    webhook-verify-token: local_dev_token
  aws:
    enabled: false
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    com.astro.leadflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
