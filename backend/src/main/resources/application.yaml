spring:
  application:
    name: astro-leadflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.astro.leadflow.shared

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  auth:
    refresh-cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:astro_refresh_token}
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}
  meta:
    api-url: ${META_API_URL:https://graph.facebook.com/v18.0}
    access-token: ${META_ACCESS_TOKEN:}
    phone-number-id: ${META_PHONE_NUMBER_ID:}
    webhook-verify-token: ${META_WEBHOOK_TOKEN:dev-webhook-token}
    webhook-secret: ${META_WEBHOOK_SECRET:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    webhook-per-minute: ${RATE_LIMIT_WEBHOOK:100}
    auth-per-minute: ${RATE_LIMIT_AUTH:10}
    general-per-minute: ${RATE_LIMIT_GENERAL:500}
  saas:
    default-plan: ${DEFAULT_PLAN:free}
    trial-days: ${TRIAL_DAYS:14}
  aws:
    enabled: ${APP_AWS_ENABLED:false}
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    s3:
      bucket: ${AWS_S3_BUCKET:leadflow-files}
    sqs:
      lead-queue: ${AWS_SQS_LEAD_QUEUE:leadflow-leads}
      marketplace-queue: ${AWS_SQS_MARKETPLACE_QUEUE:marketplace-leads.fifo}

marketplace:
  webhook-token: ${MARKETPLACE_WEBHOOK_TOKEN:}
  webmotors:
    base-url: ${WEBMOTORS_BASE_URL:https://api-webmotors.sensedia.com}
    oauth-url: ${WEBMOTORS_OAUTH_URL:https://api-webmotors.sensedia.com/oauth/v1/access-token}
    client-id: ${WEBMOTORS_CLIENT_ID:}
    client-secret: ${WEBMOTORS_CLIENT_SECRET:}
  mercadolivre:
    base-url: ${ML_BASE_URL:https://api.mercadolibre.com}
    oauth-url: ${ML_OAUTH_URL:https://api.mercadolibre.com/oauth/token}
    auth-url: ${ML_AUTH_URL:https://auth.mercadolivre.com.br/authorization}
    app-id: ${ML_APP_ID:}
    client-secret: ${ML_CLIENT_SECRET:}
    redirect-uri: ${ML_REDIRECT_URI:http://localhost:8080/api/v1/auth/mercadolivre/callback}
  reconciliation:
    cron: ${MARKETPLACE_RECONCILIATION_CRON:0 0 3 * * *}

logging:
  level:
    root: INFO
    com.astro.leadflow: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
