spring:
  application:
    name: astro-leadflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.astro.leadflow.shared

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}