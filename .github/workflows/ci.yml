name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SpringBootTest sobe com o perfil default (dev): precisa de Postgres e Redis em localhost com as credenciais de application-dev.yml
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadflow
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow123
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadflow -d leadflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Redis com senha
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass redis123
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes
        working-directory: backend
        run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  # TODO: validar em um run real. E2E depende de backend + Postgres + Redis e dos usuarios do DevBootstrapConfig (perfil dev).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadflow
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow123
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadflow -d leadflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Redis com senha
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass redis123
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend em background
        working-directory: backend
        run: |
          nohup ./gradlew bootRun --no-daemon > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:8080/actuator/health && exit 0
            sleep 5
          done
          tail -n 100 ../backend.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
