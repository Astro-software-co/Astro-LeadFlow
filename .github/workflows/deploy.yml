# Pipeline de entrega: build das imagens (ECR) -> deploy na EC2 via SSM -> smoke test.
# Automático em push na master (staging). Manual (workflow_dispatch) para reimplantar/rollback de uma tag existente.
# A produção entrará depois como outro environment, com aprovação obrigatória (ver docs/DEPLOY-AWS-STAGING.md).
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag já publicada no ECR (ex.: sha-abc1234). Vazio = construir o commit atual."
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    uses: ./.github/workflows/build-images.yml
    secrets: inherit

  deploy:
    needs: build
    # roda também quando o build foi pulado (tag informada); nunca quando o build falhou
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      TAG: ${{ inputs.image_tag || needs.build.outputs.image_tag }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - name: Validar a tag
        run: |
          echo "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "::error::tag inválida"; exit 1; }

      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/prod

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Compose, Caddyfile e scripts viajam com a release (S3) e são sincronizados na instância antes do deploy.
      - name: Publicar o pacote de infraestrutura
        run: |
          aws s3 sync infra/prod "s3://${BUCKET}/artifacts/${TAG}/" --delete \
            --exclude ".env*" --exclude "*.template" --exclude "*.example" --only-show-errors

      - name: Deploy via SSM
        run: |
          set -euo pipefail
          PARAMS="$(jq -n --arg tag "$TAG" --arg bucket "$BUCKET" --arg region "$AWS_REGION" '{
            commands: [
              "set -euo pipefail",
              "mkdir -p /opt/leadflow && cd /opt/leadflow",
              ("aws s3 sync s3://" + $bucket + "/artifacts/" + $tag + "/ /opt/leadflow/ --region " + $region + " --exclude .env --exclude .last_good_tag --only-show-errors"),
              "chmod +x /opt/leadflow/*.sh",
              ("LEADFLOW_ENV=staging AWS_REGION=" + $region + " /opt/leadflow/deploy.sh " + $tag)
            ],
            executionTimeout: ["1200"]
          }')"
          CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy $TAG" --parameters "$PARAMS" --query Command.CommandId --output text)"
          echo "SSM command: $CMD_ID"
          status="Pending"
          for _ in $(seq 1 130); do   # ~21 min
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output yaml
          [ "$status" = "Success" ] || { echo "::error::deploy terminou com status $status"; exit 1; }

      - name: Smoke test (HTTPS público)
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors -o /dev/null "${{ vars.STAGING_URL }}/"
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "${{ vars.STAGING_URL }}/api/v1/plans" | head -c 300; echo
